<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Sécurité : seuls les scripts locaux s'exécutent. Les tuiles passent par des adresses blob: et data:. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:">
  <title>Tafl</title>
  <!-- Codicons : les icônes de VS Code (les mêmes que dans Rune et Skald) -->
  <link rel="stylesheet" href="../node_modules/@vscode/codicons/dist/codicon.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../commun/claude-panneau.css">
</head>
<body class="glass">
  <!-- Barre de titre : on peut y déplacer la fenêtre. Windows dessine ses boutons à droite. -->
  <header id="titlebar">
    <!-- Tafl 0.30 : les menus d'avant (Fichier, Édition, Tuile…) sont rangés derrière ☰ -->
    <button id="btn-menu" class="icon-button" title="Menus : Fichier, Édition, Tuile, Carte, Jeu… (Alt)"><i class="codicon codicon-menu"></i></button>
    <span id="brand"><img class="logo" src="tafl.svg" alt="">Tafl</span>
    <span id="doc-name"></span>
    <!-- Les espaces de travail (espaces.js) : Accueil, Tuiles, Cartes, Événements, Données, Jeu -->
    <nav id="espaces" role="tablist" aria-label="Espaces de travail"></nav>
    <button id="btn-chercher" class="search-button" title="Chercher une carte, un événement, une donnée, une tuile ou une commande (Ctrl+K)"><i class="codicon codicon-search"></i><span class="search-label">Chercher…</span><kbd>Ctrl+K</kbd></button>
    <div class="title-actions">
      <button id="btn-jouer" class="button primary small" title="Jouer au jeu dans Saga, depuis le départ (F5). Maj+F5 : depuis la case sous la souris" hidden><i class="codicon codicon-play"></i> Jouer</button>
      <button id="btn-undo" class="icon-button" title="Annuler (Ctrl+Z)"><i class="codicon codicon-discard"></i></button>
      <button id="btn-redo" class="icon-button" title="Rétablir (Ctrl+Y)"><i class="codicon codicon-redo"></i></button>
      <button id="btn-history" class="icon-button" title="Historique : revenir à n'importe quelle étape (Ctrl+H)"><i class="codicon codicon-history"></i></button>
      <button id="btn-save" class="icon-button" title="Enregistrer (Ctrl+S)"><i class="codicon codicon-save"></i></button>
      <button id="btn-panneaux" class="icon-button" title="Montrer ou cacher les panneaux de droite (Ctrl+B)"><i class="codicon codicon-layout-sidebar-right"></i></button>
      <button id="btn-update" class="icon-button" title="Chercher et installer la dernière version de Tafl"><i class="codicon codicon-cloud-download"></i></button>
    </div>
  </header>

  <!-- Options de l'outil choisi (miroir, calque…) -->
  <div id="optionsbar"><div id="tool-options"></div></div>

  <main id="layout">
    <!-- Outils, couleurs principale / secondaire, réglages -->
    <nav id="toolbar">
      <div id="tool-buttons"></div>
      <span class="spacer"></span>
      <div id="swatches" title="Couleur principale (clic gauche) et secondaire (clic droit). X : échanger">
        <button id="color-secondary" class="swatch"></button>
        <button id="color-primary" class="swatch"></button>
      </div>
      <div class="swatch-actions">
        <button id="swap-colors" class="icon-button" title="Échanger les couleurs (X)"><i class="codicon codicon-arrow-swap"></i></button>
      </div>
      <button id="btn-settings" class="tool" title="Réglages de Tafl (Ctrl+,)"><i class="codicon codicon-gear"></i></button>
    </nav>

    <section id="workspace">
      <div id="canvas-wrap">
        <canvas id="stage" hidden></canvas>
      </div>
    </section>

    <!-- Glisser pour élargir ou rétrécir le panneau de droite (double-clic : largeur par défaut) -->
    <div id="side-resizer" title="Glisser pour élargir ou rétrécir les panneaux · double-clic : largeur par défaut"></div>

    <!-- Deux colonnes (disposition.js) : à gauche les listes, à droite les vignettes (tampons, tuiles).
         Sur une seule colonne, les deux s'effacent et les panneaux reprennent leur ordre habituel. -->
    <aside id="sidepanel">
      <div class="side-col" id="side-a">
      <!-- Mode Carte : les cartes du jeu (ville, route, maison…) et les calques de la carte affichée -->
      <section class="panel map-only" id="maps-panel">
        <div class="panel-header"><span class="panel-title">Cartes</span><span id="maps-count" class="panel-count"></span>
          <div class="panel-actions">
            <button id="map-world" class="icon-button" title="Carte monde : les villes et routes ensemble (Ctrl+Maj+M)"><i class="codicon codicon-globe"></i></button>
            <button id="map-add" class="icon-button" title="Nouvelle carte"><i class="codicon codicon-add"></i></button>
            <button id="map-duplicate" class="icon-button" title="Dupliquer la carte"><i class="codicon codicon-copy"></i></button>
            <button id="map-delete" class="icon-button" title="Supprimer la carte"><i class="codicon codicon-trash"></i></button>
            <button id="map-more" class="icon-button" title="Renommer, taille, ordre…"><i class="codicon codicon-ellipsis"></i></button>
          </div>
        </div>
        <div id="maps" class="rows"></div>
      </section>

      <section class="panel map-only" id="layers-panel">
        <div class="panel-header"><span class="panel-title">Calques</span><span id="layers-count" class="panel-count"></span>
          <div class="panel-actions">
            <button id="layer-add" class="icon-button" title="Nouveau calque, au-dessus du calque choisi"><i class="codicon codicon-add"></i></button>
            <button id="layer-up" class="icon-button" title="Monter le calque"><i class="codicon codicon-arrow-up"></i></button>
            <button id="layer-down" class="icon-button" title="Descendre le calque"><i class="codicon codicon-arrow-down"></i></button>
            <button id="layer-props" class="icon-button" title="Réglages du calque : profondeur, opacité, fusion, parallaxe"><i class="codicon codicon-settings"></i></button>
            <button id="layer-delete" class="icon-button" title="Supprimer le calque"><i class="codicon codicon-trash"></i></button>
          </div>
        </div>
        <div id="layers" class="rows"></div>
      </section>

      <!-- Les événements de la carte affichée : personnages, panneaux, coffres… (outil Événement, N) -->
      <section class="panel map-only" id="events-panel">
        <div class="panel-header"><span class="panel-title">Événements</span><span id="events-count" class="panel-count"></span>
          <div class="panel-actions">
            <button id="data-open" class="icon-button" title="Données du jeu : personnages, quêtes, créatures, attaques, objets, dresseurs, boutiques… (Ctrl+Maj+D)"><i class="codicon codicon-database"></i></button>
          </div>
        </div>
        <div id="events" class="rows"></div>
      </section>

      <section class="panel tile-only" id="color-panel">
        <div class="panel-header"><span class="panel-title">Palette</span>
          <div class="panel-actions">
            <select id="palette-preset" title="Remplacer la palette (tes tuiles ne changent pas)">
              <option value="">Changer…</option>
            </select>
          </div>
        </div>
        <div class="color-row">
          <input id="color-hex" spellcheck="false" title="Couleur principale : code hexadécimal (#rrggbb) ou « transparent »">
          <button id="color-pick" class="button small" title="Choisir la couleur principale"><i class="codicon codicon-symbol-color"></i> Choisir…</button>
          <input id="color-native" type="color" tabindex="-1">
        </div>
        <div id="palette"></div>
      </section>

      <!-- Animation : les images de la tuile choisie (une seule pour une tuile fixe) -->
      <section class="panel tile-only" id="frames-panel">
        <div class="panel-header"><span class="panel-title">Animation</span><span id="frames-count"></span>
          <div class="panel-actions">
            <button id="anim-play" class="icon-button" title="Lancer ou arrêter l'animation (P)"><i class="codicon codicon-play"></i></button>
            <button id="frame-add" class="icon-button" title="Ajouter une image : copie de l'image en cours (Ctrl+Maj+A)"><i class="codicon codicon-add"></i></button>
            <button id="frame-delete" class="icon-button" title="Supprimer l'image en cours"><i class="codicon codicon-trash"></i></button>
          </div>
        </div>
        <div id="frames"></div>
        <label class="frame-speed" title="Durée de chaque image de l'animation">
          <span>Durée d'une image</span>
          <input id="frame-duration" type="number" min="30" max="5000" step="10"><span class="unit">ms</span>
        </label>
      </section>

      <section class="panel tile-only" id="preview-panel">
        <div class="panel-header"><span class="panel-title">Aperçu 3 × 3</span><span id="preview-scale"></span></div>
        <div class="preview-box checker-bg"><canvas id="preview"></canvas></div>
      </section>
      </div>
      <div class="side-col" id="side-b">
      <!-- Les tampons : objets de plusieurs tuiles (arbre, maison…) posés d'un clic (outil Tampon, S) -->
      <section class="panel map-only" id="stamps-panel">
        <div class="panel-header"><span class="panel-title">Tampons</span><span id="stamps-count" class="panel-count"></span>
          <div class="panel-actions">
            <button id="stamp-props" class="icon-button" title="Renommer, rangées au-dessus du joueur"><i class="codicon codicon-settings"></i></button>
            <button id="stamp-delete" class="icon-button" title="Supprimer le tampon (ses tuiles restent)"><i class="codicon codicon-trash"></i></button>
          </div>
        </div>
        <div id="stamps"></div>
      </section>

      <section class="panel" id="tiles-panel">
        <div class="panel-header"><span class="panel-title">Tuiles</span><span id="tiles-count"></span>
          <div class="panel-actions">
            <button id="tile-add" class="icon-button" title="Nouvelle tuile (Ctrl+Maj+N)"><i class="codicon codicon-add"></i></button>
            <button id="tile-duplicate" class="icon-button" title="Dupliquer la tuile (Ctrl+D)"><i class="codicon codicon-copy"></i></button>
            <button id="tile-delete" class="icon-button" title="Supprimer la tuile"><i class="codicon codicon-trash"></i></button>
            <button id="tile-more" class="icon-button" title="Miroir, pivoter, décaler…"><i class="codicon codicon-ellipsis"></i></button>
          </div>
        </div>
        <div class="tiles-tools">
          <label class="tiles-search"><i class="codicon codicon-search"></i><input id="tiles-filter" type="search" placeholder="Chercher : nom, catégorie, n°" spellcheck="false"></label>
          <button id="tile-sort" class="icon-button" title="Trier et ranger les tuiles (catégories, ordre, doublons…)"><i class="codicon codicon-sort-precedence"></i></button>
        </div>
        <div id="tiles"></div>
      </section>

      </div>
    </aside>
  </main>

  <!-- Tafl 0.30 : les espaces en pleine page (espaces.js). Tuiles et Cartes restent dans #layout. -->
  <section id="pages" hidden>
    <div id="page-accueil" class="page">
      <div id="welcome">
        <img class="welcome-logo" src="tafl.svg" alt="">
        <h1>Tafl</h1>
        <p class="welcome-sub">Tuiles, cartes et jeux en pixel art, façon Pokémon</p>
        <div class="welcome-actions">
          <button id="welcome-game" class="button primary"><i class="codicon codicon-game"></i> Nouveau jeu <kbd>Ctrl+Maj+J</kbd></button>
          <button id="welcome-new" class="button"><i class="codicon codicon-new-file"></i> Nouveau jeu de tuiles <kbd>Ctrl+N</kbd></button>
          <button id="welcome-open" class="button"><i class="codicon codicon-folder-opened"></i> Ouvrir <kbd>Ctrl+O</kbd></button>
          <button id="welcome-import" class="button"><i class="codicon codicon-file-media"></i> Importer une planche <kbd>Ctrl+I</kbd></button>
        </div>
        <p class="welcome-hint">Un dossier de jeu (son jeu.json), un jeu de tuiles .tafl, ou une planche en PNG à découper. Tu peux aussi les glisser ici.</p>
        <h2 id="welcome-recents-title" hidden>Récents</h2>
        <div id="welcome-recents"></div>
      </div>
      <div id="accueil-projet" hidden></div>
    </div>
    <div id="page-evenements" class="page"></div>
    <div id="page-donnees" class="page"></div>
    <div id="page-jeu" class="page"></div>
  </section>

  <footer id="statusbar">
    <span id="status-hint"></span>
    <span class="spacer"></span>
    <span id="status-pos"></span>
    <span id="status-tile"></span>
    <span id="status-zoom"></span>
  </footer>

  <div id="modal-root"></div>

  <script src="base.js"></script>
  <script src="notify.js"></script>
  <script src="dialogs.js"></script>
  <script src="palettes.js"></script>
  <script src="doc.js"></script>
  <script src="sprites.js"></script>
  <script src="events.js"></script>
  <script src="blocs.js"></script>
  <script src="donnees.js"></script>
  <script src="samples.js"></script>
  <script src="presse-papiers.js"></script>
  <script src="stage.js"></script>
  <script src="panels.js"></script>
  <script src="disposition.js"></script>
  <script src="planche.js"></script>
  <script src="sons.js"></script>
  <script src="io.js"></script>
  <script src="post-traitement.js"></script>
  <script src="comfy.js"></script>
  <script src="monde.js"></script>
  <script src="verificateur.js"></script>
  <script src="outils-jeu.js"></script>
  <script src="espaces.js"></script>
  <script src="recherche.js"></script>
  <script src="app.js"></script>
  <script src="update.js"></script>
  <!-- Panneau Claude, commun à Skald, Tafl et Brokk (../commun/LISEZMOI.md) -->
  <script src="../commun/claude-panneau.js" data-outil="Tafl" data-bienvenue="Demande une idée de tuiles, de carte, de personnage ou de quête, un dialogue à écrire, ou de l'aide sur un fichier du projet."></script>
  <script src="pixel-art.js"></script>
  <script src="claude-actions.js"></script>
  <script src="claude-familles.js"></script>
</body>
</html>
