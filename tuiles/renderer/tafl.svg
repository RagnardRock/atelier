<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2d3e"/>
      <stop offset="1" stop-color="#0e0f16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Dégradé vert herbe vers bleu ciel : les routes et les mares d'un jeu façon Pokémon -->
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="150" y1="110" x2="360" y2="400">
      <stop offset="0" stop-color="#c4f56a"/>
      <stop offset="1" stop-color="#3fb6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glass)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- Une grille de tuiles en fond, discrète -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <path d="M160 96 V416 M224 96 V416 M288 96 V416 M352 96 V416 M96 160 H416 M96 224 H416 M96 288 H416 M96 352 H416"/>
  </g>
  <!-- La rune ᛏ (Tiwaz, le « T » de Tafl) : une flèche vers le haut -->
  <g filter="url(#glow)" fill="none" stroke="url(#metal)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 118 V400"/>
    <path d="M160 214 L256 118 L352 214"/>
  </g>
</svg>
