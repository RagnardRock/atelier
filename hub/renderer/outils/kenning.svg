<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2840"/>
      <stop offset="1" stop-color="#0f0e17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Dégradé lavande vers indigo : la flamme d'une lampe de lecture, le soir -->
    <linearGradient id="flamme" gradientUnits="userSpaceOnUse" x1="200" y1="110" x2="330" y2="410">
      <stop offset="0" stop-color="#f1e6ff"/>
      <stop offset="0.55" stop-color="#b9a3ff"/>
      <stop offset="1" stop-color="#6f6cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glass)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- La rune ᚲ (Kenaz, la torche : la lumière pour lire) : deux traits qui se rejoignent -->
  <g filter="url(#glow)" fill="none" stroke="url(#flamme)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M326 112 L190 256 L326 400"/>
  </g>
</svg>
