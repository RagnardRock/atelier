<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2d3e"/>
      <stop offset="1" stop-color="#0e0f16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Dégradé de braise (or vers rouge) : Brokk est le forgeron de l'Atelier -->
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="190" y1="100" x2="330" y2="410">
      <stop offset="0" stop-color="#ffc35c"/>
      <stop offset="1" stop-color="#ff4d3d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glass)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- La rune ᛒ (Berkanan, le « B » de Brokk) : un trait droit et deux pointes -->
  <g filter="url(#glow)" fill="none" stroke="url(#metal)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 108 L196 404"/>
    <path d="M196 108 L320 182 L196 256 L320 330 L196 404"/>
  </g>
</svg>
