<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Sécurité : seuls les scripts locaux s'exécutent. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
  <title>Atelier</title>
  <!-- Codicons : les icônes de VS Code (les mêmes que dans Rune et Skald) -->
  <link rel="stylesheet" href="../node_modules/@vscode/codicons/dist/codicon.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="glass">
  <!-- Barre de titre : on peut y déplacer la fenêtre. Windows dessine ses boutons à droite. -->
  <header id="titlebar">
    <span id="brand"><img class="logo" src="atelier.svg" alt="">Atelier</span>
    <span id="salut"></span>
    <div class="title-actions">
      <button id="btn-update" class="icon-button" title="Chercher et installer la dernière version d'Atelier"><i class="codicon codicon-cloud-download"></i></button>
      <button id="btn-settings" class="icon-button" title="Réglages d'Atelier (Ctrl+,)"><i class="codicon codicon-gear"></i></button>
    </div>
  </header>

  <main id="layout">
    <!-- Colonne de gauche : les outils (Rune, Skald…) -->
    <section id="outils" class="plaque">
      <header class="plaque-titre">
        <i class="codicon codicon-tools"></i><span>Outils</span>
        <span class="spacer"></span>
        <button id="btn-actualiser" class="icon-button" title="Regarder à nouveau sur GitHub s'il y a des nouvelles versions"><i class="codicon codicon-refresh"></i></button>
      </header>
      <div id="liste-outils"></div>
      <p id="outils-info" class="discret"></p>
    </section>

    <!-- Le reste : les widgets. Pour l'instant, Notes. -->
    <section id="widgets">
      <article id="widget-notes" class="widget plaque">
        <header class="plaque-titre">
          <i class="codicon codicon-note"></i><span>Notes</span>
          <span class="spacer"></span>
          <input id="notes-recherche" type="text" placeholder="Rechercher (Ctrl+F)" spellcheck="false">
          <button id="btn-nouvelle-note" class="icon-button" title="Nouvelle note (Ctrl+N)"><i class="codicon codicon-add"></i></button>
        </header>
        <div class="notes-corps">
          <ul id="notes-liste"></ul>
          <div class="notes-editeur">
            <div class="notes-barre">
              <span id="note-date" class="discret"></span>
              <span class="spacer"></span>
              <span id="note-etat" class="discret"></span>
              <button id="btn-epingler" class="icon-button" title="Épingler en haut de la liste"><i class="codicon codicon-pinned"></i></button>
              <button id="btn-supprimer-note" class="icon-button" title="Supprimer cette note"><i class="codicon codicon-trash"></i></button>
            </div>
            <textarea id="note-texte" placeholder="Écris ici. La première ligne devient le titre de la note. Tout s'enregistre tout seul." spellcheck="true"></textarea>
          </div>
        </div>
      </article>

      <article id="widget-projets" class="widget plaque">
        <header class="plaque-titre">
          <i class="codicon codicon-repo"></i><span>Projets récents</span>
          <span class="spacer"></span>
          <input id="projets-recherche" type="text" placeholder="Filtrer" spellcheck="false">
          <button id="btn-projets-actualiser" class="icon-button" title="Relire les projets et leur état Git"><i class="codicon codicon-refresh"></i></button>
        </header>
        <ul id="projets-liste" class="widget-liste"></ul>
        <footer class="widget-pied discret"><span id="projets-racine"></span></footer>
      </article>

      <!-- Deux widgets plus petits, l'un au-dessus de l'autre dans la même colonne -->
      <div class="widget-pile">
      <article id="widget-presse-papiers" class="widget plaque">
        <header class="plaque-titre">
          <i class="codicon codicon-clippy"></i><span>Presse-papiers et couleurs</span>
          <span class="spacer"></span>
          <button id="btn-pipette" class="icon-button" title="Pipette : prendre une couleur n'importe où sur l'écran"><!-- Codicons n'a pas de pipette : celle de Skald, en SVG --><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5l3 3"/><path d="M19.6 4.4a2 2 0 0 0-2.8 0l-2.3 2.3-1-1-1.4 1.4 1 1L5.6 15.6a2 2 0 0 0-.6 1.4V19h2a2 2 0 0 0 1.4-.6l7.5-7.5 1 1 1.4-1.4-1-1 2.3-2.3a2 2 0 0 0 0-2.8z"/></svg></button>
          <label class="icon-button" title="Ajouter une couleur à la palette"><i class="codicon codicon-symbol-color"></i><input id="couleur-ajout" type="color" value="#5fd4a8"></label>
          <button id="btn-vider-presse" class="icon-button" title="Vider l'historique du presse-papiers"><i class="codicon codicon-clear-all"></i></button>
        </header>
        <div id="palette"></div>
        <ul id="presse-liste" class="widget-liste"></ul>
      </article>

      <article id="widget-minuteurs" class="widget plaque">
        <header class="plaque-titre">
          <i class="codicon codicon-watch"></i><span>Minuteurs</span>
          <span class="spacer"></span>
          <button id="btn-minuteur-perso" class="icon-button" title="Nouveau minuteur (durée et nom au choix)"><i class="codicon codicon-add"></i></button>
        </header>
        <div id="minuteurs-raccourcis"></div>
        <div id="minuteurs-liste"></div>
      </article>
      </div>

      <article id="widget-calendrier" class="widget plaque">
        <header class="plaque-titre">
          <i class="codicon codicon-calendar"></i><span id="cal-mois">Calendrier</span>
          <span class="spacer"></span>
          <button id="btn-cal-prec" class="icon-button" title="Mois précédent"><i class="codicon codicon-chevron-left"></i></button>
          <button id="btn-cal-auj" class="button small" title="Revenir à aujourd'hui">Aujourd'hui</button>
          <button id="btn-cal-suiv" class="icon-button" title="Mois suivant"><i class="codicon codicon-chevron-right"></i></button>
          <button id="btn-cal-ajout" class="icon-button" title="Nouvel évènement (ou double-clic sur un jour)"><i class="codicon codicon-add"></i></button>
        </header>
        <div id="cal-grille"></div>
        <div id="cal-jour">
          <div class="cal-jour-titre"><span id="cal-jour-nom"></span></div>
          <ul id="cal-evenements" class="widget-liste"></ul>
        </div>
      </article>

      <!-- Claude : il lit tes notes, ton calendrier et l'état de tes projets (voir claude.js) -->
      <article id="widget-claude" class="widget plaque">
        <header class="plaque-titre">
          <i class="codicon codicon-sparkle"></i><span>Claude</span>
          <span id="claude-modele" class="discret"></span>
          <span class="spacer"></span>
          <button id="btn-claude-dossier" class="icon-button" title="Ouvrir le dossier des fichiers que Claude lit (notes, calendrier, projets)"><i class="codicon codicon-folder-opened"></i></button>
          <button id="btn-claude-conversations" class="icon-button" title="Mes conversations (Ctrl+H quand tu écris à Claude)"><i class="codicon codicon-history"></i></button>
          <button id="btn-claude-nouvelle" class="icon-button" title="Nouvelle conversation"><i class="codicon codicon-add"></i></button>
        </header>
        <!-- Liste des conversations : remplace les messages tant qu'elle est ouverte -->
        <div id="claude-conversations" hidden>
          <input id="claude-conv-recherche" type="text" placeholder="Chercher dans les conversations" spellcheck="false">
          <ul id="claude-conv-liste"></ul>
        </div>
        <div id="claude-messages"></div>
        <div id="claude-formulaire">
          <textarea id="claude-saisie" rows="1" placeholder="Demande à Claude… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)" spellcheck="true"></textarea>
          <div class="claude-actions">
            <span id="claude-etat"></span>
            <button id="btn-claude-envoyer" class="icon-button" title="Envoyer (Entrée)"><i class="codicon codicon-send"></i></button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div id="modal-root"></div>

  <script src="base.js"></script>
  <script src="notify.js"></script>
  <script src="dialogs.js"></script>
  <script src="outils.js"></script>
  <script src="notes.js"></script>
  <script src="projets.js"></script>
  <script src="presse-papiers.js"></script>
  <script src="minuteurs.js"></script>
  <script src="calendrier.js"></script>
  <script src="claude.js"></script>
  <script src="update.js"></script>
  <script src="app.js"></script>
</body>
</html>
