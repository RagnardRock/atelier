# Temporaire : reproduit l'échec « Échec de désinstallation des anciens fichiers » sur un PC Windows.
name: Diagnostic mise à jour (temporaire)
on:
  push:
    branches: [claude/project-thread-uzu8ff]
    paths: ['.github/workflows/diagnostic-maj.yml']
defaults:
  run:
    shell: pwsh
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Préparer
        run: |
          $base = 'https://github.com/RagnardRock/atelier/releases/download'
          curl.exe -sSL -o C:\old.exe "$base/brokk-v0.4.1/Brokk-Setup-0.4.1.exe"
          curl.exe -sSL -o C:\new.exe "$base/brokk-v0.4.2/Brokk-Setup-0.4.2.exe"
          curl.exe -sSL -o h.zip https://download.sysinternals.com/files/Handle.zip
          Expand-Archive h.zip -DestinationPath C:\h -Force
          Set-Content C:\lire.js "console.log('lu', require('fs').readFileSync(process.argv[2],'utf8').length); setInterval(()=>{},1000)"
          @'
          $dir = "$env:LOCALAPPDATA\Programs\Brokk"
          function Lancer($exe, $arguments, $sec) {
            $p = Start-Process $exe -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit($sec * 1000)) {
              "  >> $([IO.Path]::GetFileName($exe)) BLOQUÉ après $sec s (fenêtre d'erreur en attente)"
              Get-Process | ? { $_.MainWindowTitle } | % { "     fenêtre : $($_.Name) « $($_.MainWindowTitle) »" }
              Get-Process | ? { $_.Path -like "$env:TEMP*" -or $_.Path -like 'C:\*.exe' -and $_.Path -notlike 'C:\Windows*' -and $_.Path -notlike 'C:\Program*' -and $_.Path -notlike 'C:\h*' } | Stop-Process -Force -ErrorAction SilentlyContinue
              return -1
            }
            return $p.ExitCode
          }
          $c = Lancer C:\old.exe @('/S') 120
          "  ancienne installée : code $c, version $((Get-Item "$dir\Brokk.exe").VersionInfo.ProductVersion)"
          '@ | Set-Content C:\commun.ps1
          @'
          Start-Sleep 5
          "  poignées dans le dossier de Brokk :"
          & C:\h\handle64.exe -accepteula -nobanner $dir 2>$null | Select-Object -First 12 | % { "    $_" }
          $c = Lancer C:\new.exe @('/S','--updated') 150
          "### RÉSULTAT : code $c (version après : $((Get-Item "$dir\Brokk.exe" -ErrorAction SilentlyContinue).VersionInfo.ProductVersion))"
          '@ | Set-Content C:\fin.ps1
      - name: S5 un autre Electron a lu app.asar de Brokk (comme Atelier)
        timeout-minutes: 6
        run: |
          . C:\commun.ps1
          Copy-Item $dir C:\autre -Recurse
          $env:ELECTRON_RUN_AS_NODE = '1'
          Start-Process C:\autre\Brokk.exe -ArgumentList 'C:\lire.js',"`"$dir\resources\app.asar\package.json`"" -RedirectStandardOutput C:\lire.txt
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          . C:\fin.ps1
          Get-Content C:\lire.txt
          Get-Process Brokk -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: S7 un fichier de Brokk ouvert par un autre programme
        if: always()
        timeout-minutes: 6
        run: |
          . C:\commun.ps1
          Start-Process pwsh -ArgumentList '-NoProfile','-Command',"`$f=[IO.File]::Open('$dir\resources\app.asar','Open','Read','Read'); Start-Sleep 300" -WindowStyle Hidden
          . C:\fin.ps1
