# Temporaire : reproduit l'échec « Échec de désinstallation des anciens fichiers » sur un PC Windows.
name: Diagnostic mise à jour (temporaire)
on:
  push:
    branches: [claude/project-thread-uzu8ff]
    paths: ['.github/workflows/diagnostic-maj.yml']
jobs:
  repro:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scénarios
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $base = 'https://github.com/RagnardRock/atelier/releases/download'
          curl.exe -sSL -o old.exe "$base/brokk-v0.4.1/Brokk-Setup-0.4.1.exe"
          curl.exe -sSL -o new.exe "$base/brokk-v0.4.2/Brokk-Setup-0.4.2.exe"
          npm i --no-save --prefix el electron@44.5.1 | Out-Null
          $electron = (Resolve-Path 'el/node_modules/electron/dist/electron.exe').Path
          curl.exe -sSL -o handle.zip https://download.sysinternals.com/files/Handle.zip
          Expand-Archive handle.zip -DestinationPath h -Force
          $dir = "$env:LOCALAPPDATA\Programs\Brokk"
          function Reset-Old {
            Get-Process Brokk,electron,cmd -ErrorAction SilentlyContinue | ? { $_.Id -ne $PID } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 1
            $p = Start-Process .\old.exe -ArgumentList '/S' -Wait -PassThru
            "  (ancienne installée, code $($p.ExitCode), version $((Get-Item "$dir\Brokk.exe").VersionInfo.ProductVersion))"
          }
          function Try-Update($nom, $setup) {
            Reset-Old
            & $setup
            Start-Sleep 5
            Write-Host "  poignées dans le dossier :"
            & .\h\handle64.exe -accepteula -nobanner $dir 2>$null | Select-Object -First 15 | % { "    $_" }
            $p = Start-Process .\new.exe -ArgumentList '/S','--updated' -Wait -PassThru
            "### $nom => code $($p.ExitCode)  (version après : $((Get-Item "$dir\Brokk.exe" -ErrorAction SilentlyContinue).VersionInfo.ProductVersion))"
            Get-Process | ? { $_.Path -like "$dir*" } | % { "    encore là : $($_.Name) $($_.Id)" }
          }
          Try-Update 'S1 rien d ouvert' { }
          Try-Update 'S2 Brokk ouvert' { Start-Process "$dir\Brokk.exe" -WorkingDirectory $dir }
          Try-Update 'S3 Brokk en mode Node lancé par un autre programme (serveur MCP)' {
            $env:ELECTRON_RUN_AS_NODE = '1'
            Start-Process "$dir\Brokk.exe" -ArgumentList '-e','setInterval(()=>{},1000)'
            Remove-Item Env:ELECTRON_RUN_AS_NODE
          }
          Try-Update 'S4 programme extérieur dont le dossier courant est celui de Brokk' {
            Start-Process cmd -ArgumentList '/c','ping -n 600 127.0.0.1' -WorkingDirectory "$dir\resources" -WindowStyle Hidden
          }
          Try-Update 'S5 autre Electron qui a lu app.asar de Brokk (comme Atelier)' {
            $env:ELECTRON_RUN_AS_NODE = '1'
            $js = "console.log(require('fs').readFileSync(process.argv[1],'utf8').length); setInterval(()=>{},1000)"
            Start-Process $electron -ArgumentList '-e',"`"$js`"","`"$dir\resources\app.asar\package.json`""
            Remove-Item Env:ELECTRON_RUN_AS_NODE
          }
          Try-Update 'S6 explorateur ouvert sur le dossier' { Start-Process explorer.exe $dir }
