# Fabrique l'installeur Windows d'Atelier (Atelier-Setup-<version>.exe) sur un PC Windows de GitHub.
# Même principe que rune.yml :
# - Sur une pull request qui touche hub/ : l'installeur est fabriqué pour vérifier que tout marche,
#   et se télécharge depuis l'onglet « Checks » de la PR (rubrique « Artifacts »).
# - Sur une étiquette atelier-vX.Y.Z (git tag atelier-v0.1.0 puis git push origin atelier-v0.1.0) :
#   l'installeur est publié dans l'onglet « Releases » du dépôt.
#   Important : cette Release n'est PAS marquée « Latest », car Rune cherche ses mises à jour
#   dans la Release « Latest » du dépôt ; sinon Rune croirait qu'Atelier est sa nouvelle version.
#   Le bouton de mise à jour d'Atelier cherche donc lui-même la Release atelier-v* la plus récente,
#   puis y lit latest.yml (version et empreinte de l'installeur) pour télécharger Atelier-Setup.
name: Atelier (installeur Windows)

on:
  pull_request:
    paths: ['hub/**', '.github/workflows/atelier.yml']
  push:
    tags: ['atelier-v*']
  workflow_dispatch:

permissions:
  contents: write # pour créer la version (release) et y déposer l'installeur

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hub
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique, pour écrire les notes de version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci

      - name: Vérifier que l'étiquette correspond à la version de package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "atelier-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $VERSION de hub/package.json"
            exit 1
          fi

      - name: Fabriquer l'installeur
        run: npx electron-builder --win nsis --publish never
      - name: Vérifier que latest.yml est fabriqué (le bouton de mise à jour en a besoin)
        run: cat dist/latest.yml
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Atelier-Setup
          path: hub/dist/Atelier-Setup-*.exe
          retention-days: 14

      - name: Publier la version (installeur, latest.yml et notes de version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'atelier-v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}$GITHUB_REF_NAME
          git log --no-merges --format='- %s' "$RANGE" -- . > notes.md
          gh release create "$GITHUB_REF_NAME" dist/Atelier-Setup-*.exe dist/Atelier-Setup-*.exe.blockmap dist/latest.yml \
            --title "Atelier ${GITHUB_REF_NAME#atelier-v}" --notes-file notes.md --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
