<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2d3e"/>
      <stop offset="1" stop-color="#0e0f16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Dégradé or vers violet : la lumière d'une veillée où l'on raconte une saga -->
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="140" y1="120" x2="380" y2="390">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glass)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- Une grille de tuiles en fond, discrète (Saga joue les cartes de Tafl) -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <path d="M160 96 V416 M224 96 V416 M288 96 V416 M352 96 V416 M96 160 H416 M96 224 H416 M96 288 H416 M96 352 H416"/>
  </g>
  <!-- La rune ᛃ (Jera, « l'année », le cycle) : deux crochets qui tournent l'un autour de l'autre -->
  <g filter="url(#glow)" fill="none" stroke="url(#metal)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 120 L148 200 L236 280"/>
    <path d="M276 232 L364 312 L276 392"/>
  </g>
</svg>
