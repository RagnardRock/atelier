<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2d3e"/>
      <stop offset="1" stop-color="#0e0f16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Dégradé argent vers bleu nuit : l'eau du puits de Mímir, le gardien du savoir -->
    <linearGradient id="eau" gradientUnits="userSpaceOnUse" x1="180" y1="100" x2="340" y2="410">
      <stop offset="0" stop-color="#e4ebff"/>
      <stop offset="1" stop-color="#5b7cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glass)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- La rune ᛗ (Mannaz, le « M » de Mímir) : deux traits droits reliés par une croix -->
  <g filter="url(#glow)" fill="none" stroke="url(#eau)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 108 L176 404"/>
    <path d="M336 108 L336 404"/>
    <path d="M176 108 L336 262"/>
    <path d="M336 108 L176 262"/>
  </g>
</svg>
