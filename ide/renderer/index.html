<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Sécurité : seuls les scripts locaux s'exécutent. Monaco a besoin de styles inline, d'images et de workers data: -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' data: blob:">
  <title>Atelier</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <span id="brand">Atelier</span>
    <button id="btn-open" title="Ouvrir un dossier (Ctrl+O)">Ouvrir un dossier</button>
    <button id="btn-config" title="Modifier la configuration">Config</button>
    <button id="btn-terminal" title="Afficher / masquer le terminal (Ctrl+J)">Terminal</button>
    <span id="folder-name"></span>
  </header>

  <main id="layout">
    <aside id="sidebar">
      <!-- Deux vues dans la barre latérale : fichiers du dossier ouvert, ou serveurs favoris -->
      <div id="side-tabs">
        <button data-view="tree" class="active">Fichiers</button>
        <button data-view="servers">Serveurs</button>
      </div>
      <div id="tree" class="side-view"><p class="hint">Ouvre un dossier pour voir tes fichiers.</p></div>
      <div id="servers" class="side-view" hidden>
        <div id="server-list"></div>
        <button id="server-add" class="side-button">+ Ajouter un serveur</button>
        <form id="server-form" hidden>
          <h3 id="server-form-title">Nouveau serveur</h3>
          <label>Nom <input name="name" placeholder="Prod" required></label>
          <label>Hôte <input name="host" placeholder="mon-site.fr ou 1.2.3.4" required></label>
          <label>Utilisateur <input name="user" placeholder="root"></label>
          <label>Port <input name="port" type="number" min="1" max="65535" value="22"></label>
          <label>Clé SSH (facultatif)
            <span class="key-row"><input name="keyFile" placeholder="C:\Users\moi\.ssh\id_ed25519"><button type="button" id="server-key-pick" title="Parcourir">…</button></span>
          </label>
          <p class="form-error" id="server-form-error"></p>
          <div class="form-actions">
            <button type="button" id="server-cancel">Annuler</button>
            <button type="submit" class="primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </aside>
    <section id="workspace">
      <!-- Colonnes d'éditeurs côte à côte (créées par app.js) -->
      <div id="editor-area">
        <div id="groups"></div>
        <div id="split-dropzone">Nouvelle colonne</div>
        <div id="welcome">
          <h1>Atelier</h1>
          <p><kbd>Ctrl</kbd>+<kbd>O</kbd> ouvrir un dossier · <kbd>Ctrl</kbd>+<kbd>S</kbd> enregistrer · <kbd>Ctrl</kbd>+<kbd>W</kbd> fermer l'onglet</p>
          <p><kbd>Ctrl</kbd>+<kbd>J</kbd> terminal · <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>D</kbd> diviser l'écran · clic molette : ouvrir / fermer un onglet</p>
        </div>
      </div>
      <!-- Panneau terminal : poignée pour le redimensionner, onglets, puis les terminaux -->
      <div id="panel-resizer" hidden></div>
      <section id="terminal-panel" hidden>
        <div id="term-bar">
          <div id="term-tabs"></div>
          <select id="term-profile" title="Profil du nouveau terminal"></select>
          <button id="term-new" title="Nouveau terminal">+</button>
        </div>
        <div id="term-views"></div>
      </section>
    </section>
  </main>

  <footer id="statusbar">
    <span id="status-file"></span>
    <span id="status-msg"></span>
    <span id="status-pos"></span>
    <span id="status-lang"></span>
  </footer>

  <!-- xterm.js (affichage du terminal) : chargé AVANT le chargeur de Monaco,
       sinon il s'enregistrerait comme module AMD au lieu de créer window.Terminal -->
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <!-- Monaco : chargé depuis node_modules avec son propre chargeur AMD -->
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="notify.js"></script>
  <script src="app.js"></script>
  <script src="terminal.js"></script>
  <script src="servers.js"></script>
</body>
</html>
